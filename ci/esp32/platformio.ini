; Compiles the library for the ESP32 as esp32-firmware consumes it: through library.json,
; on the same pioarduino platform and C++ standard as its [env:esp32-poe-iso].
[platformio]
src_dir = src

[env:esp32-poe-iso]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-poe-iso
framework = arduino
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra -Werror -DOA3_MAX_EVENTS=2
lib_deps = oa3=symlink://../..
